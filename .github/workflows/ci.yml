name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR makes an in-flight run's answer
# irrelevant, so cancel it rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# How the jobs below build: the unit-test jobs go through the CMake presets in
# CMakePresets.json (directly, or through the root Makefile where it adds
# something a preset cannot - the TSan ASLR probe and the sanitizer runtime
# options). The end-to-end jobs build through epoll-server/ and http-get/'s own
# Makefiles, because that is what scripts/*.sh do.
#
# Every unit-test job writes GoogleTest's JUnit-style XML and uploads it when
# the job fails, so a failure on CI can be read without re-running it.
#
# Linters (clang-tidy, cppcheck, clang-format) live in their own workflow.

jobs:
  # The ordinary build most changes need to pass. Runs on two compilers because
  # they disagree about enough real things (uninitialized-use analysis, template
  # diagnostics, standard-library assertions) to be worth the extra minute.
  #
  # The debug preset builds everything, epoll-server and http-get included, so
  # both applications are compiled by both compilers here too.
  test:
    name: test (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-deps
        with:
          cache-name: debug-${{ matrix.cxx }}
          extra-packages: ${{ matrix.cxx == 'clang++' && 'clang' || '' }}

      - name: Configure
        run: cmake --preset debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build --preset debug

      - name: Run the unit tests
        run: ctest --preset debug -L unit --parallel "$(nproc)"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug-${{ matrix.cxx }}
          path: build/debug/test-results/
          if-no-files-found: ignore

  # The network simulator's seeded property tests (ctest label `sim`), which the
  # unit runs above leave out. The default 200 seeds take a few seconds; the
  # nightly workflow runs 100000. A failing seed leaves a pcap of the run, which
  # is uploaded with the logs.
  sim:
    name: simulator (200 seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-deps
        with:
          cache-name: debug-g++

      - name: Run the simulator property tests
        run: make sim

      - name: Upload captures and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-pcaps
          path: |
            build/debug/sim-pcaps/
            build/debug/sim-shard-*.log
          if-no-files-found: ignore

  # Treat warnings as errors, but only on the code this project actually owns.
  # A blanket -Werror would fail on -Wextra noise coming out of system headers
  # (sockaddr_ll and ifreq have members no caller is meant to initialize), which
  # would make the job fail for reasons nobody can act on - hence
  # -Wno-missing-field-initializers in the strict preset. GoogleTest is an
  # imported package, so its headers are system headers and exempt too.
  #
  # The preset covers epoll-server and http-get as well as the stack and the
  # tests. epoll-server used to be outside this job, which left the only
  # threaded code in the project as the only code not held to -Werror.
  warnings:
    name: strict warnings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-deps
        with:
          cache-name: strict

      - name: Build everything with -Wall -Wextra -Werror
        run: |
          cmake --preset strict
          cmake --build --preset strict

      - name: Run the unit tests
        run: ctest --preset strict -L unit --parallel "$(nproc)"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-strict
          path: build/strict/test-results/
          if-no-files-found: ignore

  # The test the unit suite structurally cannot be. Every unit test drives two
  # instances of THIS stack, which agree with each other by construction - and
  # that is exactly how the checksum bug in the README survived a fully passing
  # suite: both sides computed it over a re-serialization, and the kernel does
  # not. Only a real kernel on the other end of a real socket catches that
  # class, so it belongs in CI rather than in a paragraph telling people to run
  # it by hand.
  #
  # No TAP device or container privilege needed: veth pairs, network namespaces
  # and AF_PACKET all work on a hosted runner under sudo.
  integration:
    name: veth integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/netns-tools
      - name: Drive the stack over a veth pair against the kernel
        run: sudo scripts/veth_test.sh

  # The stack as a network element rather than a host: two segments that cannot
  # reach each other except through it, with a real Linux TCP stack at each end.
  # The host kernel owns no address on either network, so every packet that
  # crosses is one this stack forwarded itself - it is not enough to show
  # traffic arriving, it has to be traffic that could not have arrived any other
  # way.
  router:
    name: router forwarding
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/netns-tools
        with:
          extra-packages: traceroute
      - name: Forward between two segments, and show up in a traceroute
        run: sudo scripts/router_test.sh

  # The whole stack at once, against server software that has never heard of it.
  # veth_test.sh above proves the stack talks to the kernel; this proves it does
  # the entire job an application actually needs - starting with no address at
  # all, taking a lease from a real dnsmasq, resolving a name against that same
  # dnsmasq, routing off-link via the gateway it was handed, and fetching a
  # document from a real HTTP server.
  #
  # Independent implementations on the other end is the point. Two copies of the
  # same bug agree with each other, which is exactly how the checksum bug in the
  # README passed a full unit suite.
  demonstrator:
    name: http-get end to end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The action also stops the system-wide dnsmasq the package starts on
      # install; the test runs its own in a namespace.
      - uses: ./.github/actions/netns-tools
        with:
          extra-packages: dnsmasq python3
      - name: Fetch a URL over the stack - DHCP, DNS, routing, TCP, HTTP
        run: sudo scripts/http_get_test.sh

  # Unit tests confirm behavior; sanitizers confirm the behavior was not
  # reached through undefined behavior. Both bugs fixed in the commit that
  # introduced this workflow (a missing virtual destructor on a class deleted
  # through a base pointer, and enums assigned from wire data without a fixed
  # underlying type) were invisible to a fully passing test suite and caught
  # here.
  #
  # Note what each job is actually worth. The asan job runs ASan, UBSan, and
  # leak detection over the whole suite, which parses deliberately malformed
  # input in the fuzz tests. The tsan job hunts real races: test_threading.cpp
  # drives epoll-server's thread pool and completion queue under contention,
  # which needs only eventfd - no TAP device or NET_ADMIN.
  #
  # These run through `make asan` / `make tsan` rather than ctest: the Makefile
  # sets the sanitizer runtime options (halt_on_error, so a report is a
  # failure) and, for TSan, probes whether ASLR can be disabled. GTEST_OUTPUT
  # gets the JUnit XML out of a binary run directly.
  #
  # GoogleTest itself comes from the distribution package and is not
  # instrumented. That is fine for ASan; for TSan it means a race inside
  # GoogleTest's own bookkeeping would go unseen, and the tests only assert
  # from the test thread, so there is none to see.
  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]
    # Both block the build. TSan aborts at startup (exit 66) on a host where it
    # cannot disable ASLR, but `make tsan` probes for that and runs under
    # setarch -R when it can, which hosted runners allow - see the Makefile.
    env:
      GTEST_OUTPUT: xml:${{ github.workspace }}/test-results/
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-deps
        with:
          cache-name: ${{ matrix.sanitizer }}

      - name: Run the suite under ${{ matrix.sanitizer }}
        run: make ${{ matrix.sanitizer }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.sanitizer }}
          path: test-results/
          if-no-files-found: ignore

  # What the unit suite never reaches, per file, on every push. Informational:
  # there is no threshold, because a number to defend invites tests written for
  # the number. The table goes into the job summary so it can be read on the
  # run page without downloading anything; the HTML version is an artifact.
  #
  # Coverage is clang's source-based coverage, so this job installs clang and
  # llvm (for llvm-profdata and llvm-cov of the same version) whatever the
  # other jobs use.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GTEST_OUTPUT: xml:${{ github.workspace }}/test-results/
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-deps
        with:
          cache-name: coverage
          extra-packages: clang llvm

      - name: Run the suite with coverage
        run: make coverage

      - name: Write the report to the job summary
        run: |
          {
            echo "## Unit-test coverage"
            echo
            echo '```'
            cat build/coverage/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/html/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-coverage
          path: test-results/
          if-no-files-found: ignore
